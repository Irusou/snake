<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="./index.js" defer></script>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="icon" type="image/x-icon" href="./snek.svg" />
  <title>Snake</title>
</head>

<body>
  <canvas id="gameCanvas" style="border: 1px solid black;"></canvas>
  <div>
    <div class="score"></div>
    <div class="controls">
      <div>
        <div>Movement:</div>
        <div>w - up</div>
        <div>s - down</div>
        <div>a - left</div>
        <div>d - right</div>
      </div>
      <div>
        <div>Commands:</div>
        <div>k - start</div>
        <div>r - restart</div>
        <div>p - pause</div>
      </div>
    </div>
</body>

</html>
